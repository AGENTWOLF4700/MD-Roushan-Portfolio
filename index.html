    <!-- Theme initialization to avoid flash of wrong theme -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('md-roushan-portfolio-theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
